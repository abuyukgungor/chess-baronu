              const kalanKare = tas.renk === BEYAZ ? r : (7 - r);
              if (kalanKare === 1) pozisyonBonusu += 80;
              else if (kalanKare === 2) pozisyonBonusu += 40;
              else if (kalanKare === 3) pozisyonBonusu += 15;
            }

            // Piyon Yapısı Analizi (Pawn Structure Analysis)
            if (tas.tip === PIYON) {
              // a) Duble Piyon Kontrolü (Doubled Pawns) - Sütunda başka kendi piyonu var mı?
              let dublePiyonVar = false;
              for (let row = 0; row < 8; row++) {
                if (row !== r) {
                  const baskaTas = t[row][c];
                  if (baskaTas && baskaTas.tip === PIYON && baskaTas.renk === tas.renk) {
                    dublePiyonVar = true;
                    break;
                  }
                }
              }
              if (dublePiyonVar) {
                pozisyonBonusu -= 1.5; // -15 centipawn ölçeklenmiş ceza
              }

              // b) İzole Piyon Kontrolü (Isolated Pawns) - Yan sütunlarda kendi piyonu var mı?
              let komsuSutunlardaKendiPiyonuVar = false;
              const solSutun = c - 1;
              const sagSutun = c + 1;
              for (let row = 0; row < 8; row++) {
                if (solSutun >= 0) {
                  const solTas = t[row][solSutun];
                  if (solTas && solTas.tip === PIYON && solTas.renk === tas.renk) {
                    komsuSutunlardaKendiPiyonuVar = true;
                    break;
                  }
                }
                if (sagSutun < 8) {
                  const sagTas = t[row][sagSutun];
                  if (sagTas && sagTas.tip === PIYON && sagTas.renk === tas.renk) {
                    komsuSutunlardaKendiPiyonuVar = true;
                    break;
                  }
                }
              }
              if (!komsuSutunlardaKendiPiyonuVar) {
                pozisyonBonusu -= 2.0; // -20 centipawn ölçeklenmiş ceza
              }
            }

            // Piyon Tehdidi Cezası (Pawn Threat Penalty)
            if (tas.tip !== PIYON && tas.tip !== SAH) {
              let piyonTehdidiVar = false;
              if (tas.renk === BEYAZ) {
                // Beyaz değerli taş için üst satırdaki (r - 1) siyah piyon tehdidi
                const ustSatir = r - 1;
                if (ustSatir >= 0) {
                  if (c - 1 >= 0) {
                    const komsu = t[ustSatir][c - 1];
                    if (komsu && komsu.tip === PIYON && komsu.renk === SIYAH) {
                      piyonTehdidiVar = true;
                    }
                  }
                  if (!piyonTehdidiVar && c + 1 < 8) {
                    const komsu = t[ustSatir][c + 1];
                    if (komsu && komsu.tip === PIYON && komsu.renk === SIYAH) {
                      piyonTehdidiVar = true;
                    }
                  }
                }
              } else {
                // Siyah değerli taş için alt satırdaki (r + 1) beyaz piyon tehdidi
                const altSatir = r + 1;
                if (altSatir < 8) {
                  if (c - 1 >= 0) {
                    const komsu = t[altSatir][c - 1];
                    if (komsu && komsu.tip === PIYON && komsu.renk === BEYAZ) {
                      piyonTehdidiVar = true;
                    }
                  }
                  if (!piyonTehdidiVar && c + 1 < 8) {
                    const komsu = t[altSatir][c + 1];
                    if (komsu && komsu.tip === PIYON && komsu.renk === BEYAZ) {
                      piyonTehdidiVar = true;
                    }
                  }
                }
              }

              if (piyonTehdidiVar) {
                pozisyonBonusu -= 50; // Piyon tarafından tehdit edilme cezası
              }
            }

            // ŞAH GÜVENLİĞİ DEĞERLENDİRMESİ
            if (tas.tip === SAH) {
              if (tas.rokYapti === true) {
                // a) Rok Bonusu
                pozisyonBonusu += 60;
              } else if (!tas.hareketEtti) {
                // b) Merkezde Kalma Cezası (erken/orta oyunda)
                const baslangicSutununda = (c === 3 || c === 4);

                // Önündeki dikeyde kendi piyonu var mı kontrolü
                let piyonKorumaVar = false;
                const piyonSatiri = tas.renk === BEYAZ ? 6 : 1;
                const piyonAdayi = t[piyonSatiri][c];
                if (piyonAdayi && piyonAdayi.tip === PIYON && piyonAdayi.renk === tas.renk) {
                  piyonKorumaVar = true;
                }

                if ((baslangicSutununda || !piyonKorumaVar) && erkenOrtaSafha) {
                  pozisyonBonusu -= 30;
                }
              } else if (tas.hareketEtti && !tas.rokYapti) {
                // c) Rok Hakkını Kaybetme Cezası
                pozisyonBonusu -= 50;
              }
            }

            skor += (TAS_PUANLARI[tas.tip] + pozisyonBonusu) * carpani;
          }
        }
      }

      // ====================================================================
      // MAT AĞI (MATING NET) - OYUN SONU DEĞERLENDİRMESİ
      // ====================================================================
      // Her iki tarafın ağır/hafif taş materyali düşükse oyun sonudur (örneğin <= 150 puan)
      if (oyunSonu) {
        const materyalFarki = beyazPiyonsuzMaterial - siyahPiyonsuzMaterial;
        const absFark = Math.abs(materyalFarki);

        // Belirgin bir materyal üstünlüğü varsa mat ağı puanlaması yapalım (en az 300 puan, örn: 1 minör veya ağır alet önde olmak)
        if (absFark >= 300 && beyazSahS !== -1 && siyahSahS !== -1) {
          if (materyalFarki > 0) {
            // BEYAZ KAZANIYOR: Siyah Şahı köşeye itmeli, Beyaz Şahı Siyah Şah'a yaklaştırmalıyız
            const distRow = Math.abs(siyahSahS - 3.5);
            const distCol = Math.abs(siyahSahX - 3.5);
            const centerDistance = distRow + distCol; // Siyah şahın merkeze uzaklığı (ne kadar büyükse o kadar köşede)

            const kingDistance = Math.max(Math.abs(beyazSahS - siyahSahS), Math.abs(beyazSahX - siyahSahX)); // İki şah arası Chebyshev mesafesi

            const matAgiBonusu = (centerDistance * 20) + (8 - kingDistance) * 20;
            skor -= matAgiBonusu; // Beyaz kazandığı için skoru daha negatif yapıyoruz
          } else {
            // SİYAH KAZANIYOR: Beyaz Şahı köşeye itmeli, Siyah Şahı Beyaz Şah'a yaklaştırmalıyız
            const distRow = Math.abs(beyazSahS - 3.5);
            const distCol = Math.abs(beyazSahX - 3.5);
            const centerDistance = distRow + distCol; // Beyaz şahın merkeze uzaklığı

            const kingDistance = Math.max(Math.abs(beyazSahS - siyahSahS), Math.abs(beyazSahX - siyahSahX)); // İki şah arası Chebyshev mesafesi

            const matAgiBonusu = (centerDistance * 20) + (8 - kingDistance) * 20;
            skor += matAgiBonusu; // Siyah kazandığı için skoru daha pozitif yapıyoruz
          }
        }
      }

      return skor;
    }

    function isSameMove(a, b) {
      return a && b && a.eskiS === b.eskiS && a.eskiX === b.eskiX && a.yeniS === b.yeniS && a.yeniX === b.yeniX;
    }

    function saveKillerMove(ply, move) {
      if (ply === null || ply < 0 || ply >= 100) return;
      const slot = killerMoves[ply];
      // Eğer hamle slot[0] ile aynıysa zaten 1. sırada, bir şey yapma
      if (slot[0] && isSameMove(slot[0], move)) {
        return;
      }
      // Farklıysa, 1. sıradakini 2. sıraya kaydır ve yeni hamleyi 1. sıraya yaz
      slot[1] = slot[0];
      slot[0] = { eskiS: move.eskiS, eskiX: move.eskiX, yeniS: move.yeniS, yeniX: move.yeniX };
    }

    function getMoveOrderingScore(h, t, ply) {
      const hedefTas = t[h.yeniS][h.yeniX];
      if (hedefTas) {
        return 100 + TAS_PUANLARI[hedefTas.tip];
      }
      if (ply !== null && ply >= 0 && ply < 100) {
        const slot = killerMoves[ply];
        if (isSameMove(h, slot[0])) return 90;
        if (isSameMove(h, slot[1])) return 80;
      }
      return 0;
    }

    function tumGecerliHamleleriBul(renk, t, ply = null) {
      let hamleler = [];
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if (t[r][c] && t[r][c].renk === renk) {
            const kareHamleleri = gecerliHamleleriHesapla(r, c, t);
            for (let h of kareHamleleri) {
              hamleler.push({ eskiS: r, eskiX: c, yeniS: h.satir, yeniX: h.sutun });
            }
          }
        }
      }
      // Alpha-Beta budamasının daha verimli olması için taş yeme ve katil hamleleri önce değerlendir
      hamleler.sort((a, b) => {
        const scoreA = getMoveOrderingScore(a, t, ply);
        const scoreB = getMoveOrderingScore(b, t, ply);
        return scoreB - scoreA;
      });
      return hamleler;
    }

    function sadeceYemeHamleleriBul(renk, t) {
      let hamleler = [];
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if (t[r][c] && t[r][c].renk === renk) {
            const kareHamleleri = gecerliHamleleriHesapla(r, c, t);
            for (let h of kareHamleleri) {
              const hedefTas = t[h.satir][h.sutun];
              const isEnPassant = t[r][c].tip === PIYON && enPassantHedefi && h.satir === enPassantHedefi.satir && h.sutun === enPassantHedefi.sutun;
              if (hedefTas || isEnPassant) {
                hamleler.push({ eskiS: r, eskiX: c, yeniS: h.satir, yeniX: h.sutun });
              }
            }
          }
        }
      }
      // MVV-LVA Sıralaması (Most Valuable Victim - Least Valuable Victim/Aggressor)
      hamleler.sort((a, b) => {
        const hedefA = t[a.yeniS][a.yeniX];
        const hedefB = t[b.yeniS][b.yeniX];
        const puanA = hedefA ? TAS_PUANLARI[hedefA.tip] : (t[a.eskiS][a.eskiX].tip === PIYON ? 10 : 0);
        const puanB = hedefB ? TAS_PUANLARI[hedefB.tip] : (t[b.eskiS][b.eskiX].tip === PIYON ? 10 : 0);
        return puanB - puanA;
      });
      return hamleler;
    }

    function quiescenceSearch(t, alpha, beta, isSiyah, qDerinlik = 0) {
      const standPat = tahtaDegerlendir(t);

      // Tahtadaki anlık taş yoğunluğunu sayalım
      let tasSayisi = 0;
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if (t[r][c]) tasSayisi++;
        }
      }

      // Kullanıcının harika fikri: Adaptif Derinlik Sınırı (Adaptive Depth Scaling)
      let limitDerinlik = 2;
      if (tasSayisi < 10) {
        limitDerinlik = 5;
      } else if (tasSayisi < 20) {
        limitDerinlik = 4;
      }

      if (qDerinlik >= limitDerinlik) {
        return standPat;
      }

      if (isSiyah) {
        // Siyah (AI) maksimize etmeye çalışıyor
        if (standPat >= beta) {
          return standPat;
        }
        if (standPat > alpha) {
          alpha = standPat;
        }

        const yemeHamleleri = sadeceYemeHamleleriBul(SIYAH, t);
        for (let h of yemeHamleleri) {
          const kopya = tahtaKopyala(t);
          aiSanalHamleUygula(kopya, h);
          const skor = quiescenceSearch(kopya, alpha, beta, false, qDerinlik + 1);
          if (skor >= beta) {
            return skor;
          }
          if (skor > alpha) {
            alpha = skor;
          }
        }
        return alpha;
      } else {
        // Beyaz (Oyuncu) minimize etmeye çalışıyor
        if (standPat <= alpha) {
          return standPat;
        }
        if (standPat < beta) {
          beta = standPat;
        }

        const yemeHamleleri = sadeceYemeHamleleriBul(BEYAZ, t);
        for (let h of yemeHamleleri) {
          const kopya = tahtaKopyala(t);
          aiSanalHamleUygula(kopya, h);
          const skor = quiescenceSearch(kopya, alpha, beta, true, qDerinlik + 1);
          if (skor <= alpha) {
            return skor;
          }
          if (skor < beta) {
            beta = skor;
          }
        }
        return beta;
      }
    }

    function aiSanalHamleUygula(t, h) {
      const tas = t[h.eskiS][h.eskiX];

      // Rok
      if (tas.tip === SAH && Math.abs(h.yeniX - h.eskiX) === 2) {
        tas.rokYapti = true;
        if (h.yeniX === 6) { t[h.yeniS][5] = t[h.yeniS][7]; t[h.yeniS][7] = null; }
        else if (h.yeniX === 2) { t[h.yeniS][3] = t[h.yeniS][0]; t[h.yeniS][0] = null; }
      }

      // En Passant
      if (tas.tip === PIYON && Math.abs(h.yeniX - h.eskiX) === 1 && !t[h.yeniS][h.yeniX]) {
        t[tas.renk === BEYAZ ? h.yeniS + 1 : h.yeniS - 1][h.yeniX] = null;
      }

      t[h.yeniS][h.yeniX] = tas;
      t[h.eskiS][h.eskiX] = null;
      if (t[h.yeniS][h.yeniX]) t[h.yeniS][h.yeniX].hareketEtti = true;

      // Terfi
      if (tas.tip === PIYON && (h.yeniS === 0 || h.yeniS === 7)) {
        t[h.yeniS][h.yeniX].tip = VEZIR;
      }
    }

    function minimax(t, derinlik, alpha, beta, isSiyah, allowNull = true) {
      if (derinlik === 0) {
        // Tahtadaki toplam taş sayısını sayalım
        let tasSayisi = 0;
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            if (t[r][c]) tasSayisi++;
          }
        }

        // Durgunluk Araması sadece tahtadaki taş sayısı 20'nin altındayken (geç oyun ortası/sonu) çalışsın
        // Ayrıca kalan süre 1 dakikanın altındaysa arama yükünü sıfırlamak için yine çalışmasın
        if (kalanSure[SIYAH] < 60 || tasSayisi >= 20) {
          return tahtaDegerlendir(t);
        }
        return quiescenceSearch(t, alpha, beta, isSiyah);
      }

      const aktifRenk = isSiyah ? SIYAH : BEYAZ;

      // ====================================================================
      // NULL MOVE PRUNING (Boş Hamle Budaması)
      // ====================================================================
      if (allowNull && derinlik >= 3 && !sahTehditteMi(aktifRenk, t)) {
        let aktifPiyonsuzMaterial = 0;
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const tas = t[r][c];
            if (tas && tas.renk === aktifRenk && tas.tip !== PIYON && tas.tip !== SAH) {
              aktifPiyonsuzMaterial += TAS_PUANLARI[tas.tip];
            }
          }
        }

        if (aktifPiyonsuzMaterial > 1500) {
          const kopya = tahtaKopyala(t);
          // R = 2 derinlik azaltımı ile pas geçme araması
          let nullPuan = -minimax(kopya, derinlik - 1 - 2, -beta, -beta + 1, !isSiyah, false);
          if (nullPuan >= beta) {
            return beta;
          }
        }
      }

      const hamleler = tumGecerliHamleleriBul(aktifRenk, t, derinlik);

      if (hamleler.length === 0) {
        if (sahTehditteMi(aktifRenk, t)) return isSiyah ? -99999 : 99999;
        return 0; // Pat
      }

      if (isSiyah) {
        let maxEval = -Infinity;
        for (let i = 0; i < hamleler.length; i++) {
          const h = hamleler[i];
          const kopya = tahtaKopyala(t);
          aiSanalHamleUygula(kopya, h);

          const inCheck = sahTehditteMi(aktifRenk, t);
          const isCapture = t[h.yeniS][h.yeniX] || (t[h.eskiS][h.eskiX].tip === PIYON && enPassantHedefi && h.yeniS === enPassantHedefi.satir && h.yeniX === enPassantHedefi.sutun);
          const givesCheck = sahTehditteMi(BEYAZ, kopya);

          let puan;
          if (derinlik >= 3 && i > 3 && !isCapture && !givesCheck && !inCheck) {
            // LMR (Late Move Reduction) - 1 derinlik indirimi ile sığ arama (derinlik - 2)
            puan = minimax(kopya, derinlik - 2, alpha, beta, false);
            // Re-Search: Eğer bu hamle alpha'yı geçerse LMR yanılmıştır, tam derinlikte yeniden ara
            if (puan > alpha) {
              puan = minimax(kopya, derinlik - 1, alpha, beta, false);
            }
          } else {
            puan = minimax(kopya, derinlik - 1, alpha, beta, false);
          }

          if (puan > maxEval) maxEval = puan;
          if (maxEval > alpha) alpha = maxEval;
          if (beta <= alpha) {
            // Katil Hamle (Killer Heuristic) Kaydı
            const hedefTas = t[h.yeniS][h.yeniX];
            if (!hedefTas) {
              saveKillerMove(derinlik, h);
            }
            break;
          }
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (let i = 0; i < hamleler.length; i++) {
          const h = hamleler[i];
          const kopya = tahtaKopyala(t);
          aiSanalHamleUygula(kopya, h);

          const inCheck = sahTehditteMi(aktifRenk, t);
          const isCapture = t[h.yeniS][h.yeniX] || (t[h.eskiS][h.eskiX].tip === PIYON && enPassantHedefi && h.yeniS === enPassantHedefi.satir && h.yeniX === enPassantHedefi.sutun);
          const givesCheck = sahTehditteMi(SIYAH, kopya);

          let puan;
          if (derinlik >= 3 && i > 3 && !isCapture && !givesCheck && !inCheck) {
            // LMR (Late Move Reduction) - 1 derinlik indirimi ile sığ arama (derinlik - 2)
            puan = minimax(kopya, derinlik - 2, alpha, beta, true);
            // Re-Search: Eğer bu hamle beta'yı geçerse LMR yanılmıştır, tam derinlikte yeniden ara
            if (puan < beta) {
              puan = minimax(kopya, derinlik - 1, alpha, beta, true);
            }
          } else {
            puan = minimax(kopya, derinlik - 1, alpha, beta, true);
          }

          if (puan < minEval) minEval = puan;
          if (minEval < beta) beta = minEval;
          if (beta <= alpha) {
            // Katil Hamle (Killer Heuristic) Kaydı
            const hedefTas = t[h.yeniS][h.yeniX];
            if (!hedefTas) {
              saveKillerMove(derinlik, h);
            }
            break;
          }
        }
        return minEval;
      }
    }

    async function bilgisayarHamleYap() {
      if (oyunBitti) return;

      const olasiHamleler = tumGecerliHamleleriBul(bilgisayarRengi, tahta);
      if (olasiHamleler.length === 0) {
        aiDusununuyor = false;
        return;
      }

      const zorlukSecimi = document.getElementById('ai-difficulty').value;

      // === AÇILIŞ KİTABI (OPENING BOOK) ENTEGRASYONU ===
      let kitaptanHamleSecildi = false;
      let secilenHamle = null;

      // Yeşil Elma (Kaotik) botu için %70 ihtimalle kitabı yoksayma istisnası
      const kitapYoksay = (zorlukSecimi === '6' && Math.random() < 0.7);

      if (typeof ACILIS_KITABI !== 'undefined' && !kitapYoksay) {
        // Hamle geçmişini temizleyip düz bir dizi haline getirelim (+ ve # işaretlerini siliyoruz)
        let temizGecmis = [];
        for (let h of hamleGecmisi) {
          if (h.beyaz) temizGecmis.push(h.beyaz.replace(/[+#]/g, ''));
          if (h.siyah) {
            const temizSiyah = h.siyah.replace(/[+#]/g, '');
            if (temizSiyah) temizGecmis.push(temizSiyah);
          }
        }
        const gecmisAnahtari = temizGecmis.join(' ');
        const kitaptakiHamle = ACILIS_KITABI[gecmisAnahtari];

        if (kitaptakiHamle) {
          let hedefNotasyonlar = [];
          if (Array.isArray(kitaptakiHamle)) {
            hedefNotasyonlar = kitaptakiHamle;
          } else {
            hedefNotasyonlar = [kitaptakiHamle];
          }

          // Olası hamleler içinden kitaptaki önerilen hamlelerle eşleşenleri bulalım
          let eslesenHamleler = [];
          for (let h of olasiHamleler) {
            const notasyon = getHamleNotasyonu(h.eskiS, h.eskiX, h.yeniS, h.yeniX, tahta);
            if (hedefNotasyonlar.includes(notasyon)) {
              eslesenHamleler.push({ hamle: h, notasyon: notasyon });
            }
          }

          if (eslesenHamleler.length > 0) {
            // Eşleşen hamleler içinden rastgele birini seç
            const secilenObj = eslesenHamleler[Math.floor(Math.random() * eslesenHamleler.length)];
            secilenHamle = secilenObj.hamle;
            kitaptanHamleSecildi = true;
            console.log(`[Açılış Kitabı] Hamle seçildi: ${secilenObj.notasyon} (Anahtar: "${gecmisAnahtari}")`);
          }
        }
      }

      if (kitaptanHamleSecildi && secilenHamle) {
        // Kitaptan hamle oynatılıyorsa Minimax algoritması hiç çalıştırılmaz!
        botunSonDurumu = 'hamleYapti';

        let gecikmeSuresi = 1200;
        if (zorlukSecimi === '5') {
          gecikmeSuresi = 100;
        }

        // Bota şah çekilmişse ekstradan 1.5 saniye (1500 ms) daha beklesin
        if (sahTehditteMi(bilgisayarRengi, tahta)) {
          gecikmeSuresi += 1500;
        }

        if (kalanSure[bilgisayarRengi] < 60) {
          gecikmeSuresi = 0;
        }

        // Açılıştaki ilk hamlede default olarak 1 saniye delay olsun
        let botunIlkHamlesi = false;
        if (bilgisayarRengi === SIYAH) {
          if (hamleGecmisi.length === 0 || (hamleGecmisi.length === 1 && (!hamleGecmisi[0].siyah || hamleGecmisi[0].siyah === ''))) {
            botunIlkHamlesi = true;
          }
        } else {
          if (hamleGecmisi.length === 0) {
            botunIlkHamlesi = true;
          }
        }
        if (botunIlkHamlesi) {
          gecikmeSuresi = 1000;
        }

        // Seçim sarı ışığını hamlenin yapılmasına 300 ms kala yakalım (gecikme 300 ms'den büyükse)
        const isikGecikmesi = Math.max(0, gecikmeSuresi - 300);
        setTimeout(() => {
          seciliKare = { satir: secilenHamle.eskiS, sutun: secilenHamle.eskiX };
          tahtayiCiz();
        }, isikGecikmesi);

        setTimeout(() => {
          aiDusununuyor = false;
          hamleYap(secilenHamle.eskiS, secilenHamle.eskiX, secilenHamle.yeniS, secilenHamle.yeniX);
        }, gecikmeSuresi);

        return; // Fonksiyondan erken çıkarak Minimax hesaplamasını atlıyoruz!
      }
      // === AÇILIŞ KİTABI ENTEGRASYONU SONU ===

      // 1. Tahtadaki anlık taş sayısını hesaplayalım
      let tasSayisi = 0;
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if (tahta[r][c]) tasSayisi++;
        }
      }

      let derinlik = 3;

      if (zorlukSecimi === '6') {
        // Yeşil Elma (Kaotik) için rastgele derinlik: 2 veya 3
        derinlik = Math.random() < 0.5 ? 2 : 3;
        console.log(`Kaotik Bot (Yeşil Elma) Seçilen Derinlik: ${derinlik}`);
      } else {
        if (zorlukSecimi === '3') {
          // bot1 için depth = 4
          derinlik = 4;
        } else {
          // bot2 (4) ve bot3 (5) için kendi derinlik değerleri (4 ve 5)
          derinlik = parseInt(zorlukSecimi) || 3;
        }

        // 2. Dinamik Derinlik Artışı (Depth Extension)
        const eskiDerinlik = derinlik;
        if (tasSayisi <= 5) {
          derinlik += 2;
        } else if (tasSayisi >= 6 && tasSayisi <= 10) {
          derinlik += 1;
        }

        if (derinlik !== eskiDerinlik) {
          console.log(`[Dinamik Derinlik Artışı] Taş Sayısı: ${tasSayisi}, Varsayılan Derinlik: ${eskiDerinlik} -> Yeni Derinlik: ${derinlik}`);
        }
      }

      console.log(`Taş Sayısı: ${tasSayisi}, Dinamik Derinlik: ${derinlik}`);

      let hamleSkorlari = olasiHamleler.map(h => ({ hamle: h, puan: 0 }));

      if (zorlukSecimi === '6') {
        // Kaotik Bot (Yeşil Elma) - İteratif Arama yapma, tek seferde hesapla
        for (let obj of hamleSkorlari) {
          const kopya = tahtaKopyala(tahta);
          aiSanalHamleUygula(kopya, obj.hamle);

          // Tarayıcının donmaması için es
          await new Promise(r => setTimeout(r, 0));

          let puan = minimax(kopya, derinlik - 1, -Infinity, Infinity, (bilgisayarRengi === BEYAZ));

          // Üçlü tekrar (beraberlik) kontrolü
          const simPozStr = serializeTahta(kopya, oyuncuRengi);
          let simTekrarSayisi = 0;
          for (let p of pozisyonGecmisi) {
            if (p === simPozStr) simTekrarSayisi++;
          }

          if (simTekrarSayisi >= 2) {
            const botAvantajliMi = bilgisayarRengi === SIYAH ? (puan > 0) : (puan < 0);
            if (botAvantajliMi) {
              puan = bilgisayarRengi === SIYAH ? -99999 : 99999;
            } else {
              puan = 0;
            }
          }

          obj.puan = puan;
        }

        // Hamleleri skorlarına göre diz (en iyi hamle en başta olacak şekilde)
        if (bilgisayarRengi === SIYAH) {
          hamleSkorlari.sort((a, b) => b.puan - a.puan);
        } else {
          hamleSkorlari.sort((a, b) => a.puan - b.puan);
        }
      } else {
        // Kademeli Derinleşme (Iterative Deepening) Algoritması
        for (let d = 1; d <= derinlik; d++) {
          for (let obj of hamleSkorlari) {
            const kopya = tahtaKopyala(tahta);
            aiSanalHamleUygula(kopya, obj.hamle);

            // Arayüzün nefes alması için asenkron es (yield)
            await new Promise(r => setTimeout(r, 0));

            // Minimax araması: d - 1 derinliğinde çağırıyoruz
            let puan = minimax(kopya, d - 1, -Infinity, Infinity, (bilgisayarRengi === BEYAZ));

            // Üçlü tekrar (beraberlik) kontrolü
            const simPozStr = serializeTahta(kopya, oyuncuRengi);
            let simTekrarSayisi = 0;
            for (let p of pozisyonGecmisi) {
              if (p === simPozStr) simTekrarSayisi++;
            }

            if (simTekrarSayisi >= 2) {
              const botAvantajliMi = bilgisayarRengi === SIYAH ? (puan > 0) : (puan < 0);
              if (botAvantajliMi) {
                puan = bilgisayarRengi === SIYAH ? -99999 : 99999;
              } else {
                puan = 0;
              }
            }

            obj.puan = puan;
          }

          // Her derinlik seviyesinin sonunda hamleleri yeni skorlarına göre sırala (Move Ordering)
          // Bir sonraki derinlik iterasyonunda minimax bu sıralanmış listeyi en iyi hamleden başlayarak arayacaktır!
          if (bilgisayarRengi === SIYAH) {
            hamleSkorlari.sort((a, b) => b.puan - a.puan);
          } else {
            hamleSkorlari.sort((a, b) => a.puan - b.puan);
          }
        }
        console.log(`Iterative Deepening Tamamlandı. Ulaşılan Derinlik: ${derinlik}`);
      }

      let secilen;

      if (zorlukSecimi === '6') {
        // Yeşil Elma (Kaotik) oyun stili
        const zar = Math.random();
        if (zar < 0.60) {
          // %60 ihtimalle en iyi 1. hamle
          secilen = hamleSkorlari[0].hamle;
          console.log("Kaotik Bot (Yeşil Elma): %60 olasılıkla 1. en iyi hamle seçildi.");
        } else if (zar < 0.90) {
          // %30 ihtimalle en iyi 2. hamle (varsa)
          const secilenObj = hamleSkorlari[1] || hamleSkorlari[0];
          secilen = secilenObj.hamle;
          console.log("Kaotik Bot (Yeşil Elma): %30 olasılıkla 2. en iyi hamle seçildi.");
        } else {
          // %10 ihtimalle en iyi 3. veya 4. hamle (varsa)
          const adaylar = [];
          if (hamleSkorlari[2]) adaylar.push(hamleSkorlari[2]);
          if (hamleSkorlari[3]) adaylar.push(hamleSkorlari[3]);

          if (adaylar.length > 0) {
            const secilenObj = adaylar[Math.floor(Math.random() * adaylar.length)];
            secilen = secilenObj.hamle;
            console.log("Kaotik Bot (Yeşil Elma): %10 olasılıkla 3. veya 4. en iyi hamle seçildi.");
          } else {
            // Aday yoksa eldeki en son / en düşük kaliteli hamle
            const secilenObj = hamleSkorlari[hamleSkorlari.length - 1];
            secilen = secilenObj.hamle;
            console.log("Kaotik Bot (Yeşil Elma): Olasılık fallback ile son sıradaki hamle seçildi.");
          }
        }
      } else {
        // Standart Botlar: %100 doğruluk ile en iyi hamle(ler) arasından seçim yapar
        let enIyiPuan = hamleSkorlari[0].puan;
        let enIyiHamleler = hamleSkorlari.filter(hs => hs.puan === enIyiPuan).map(hs => hs.hamle);
        secilen = enIyiHamleler[Math.floor(Math.random() * enIyiHamleler.length)];
      }

      // Seçilen hamlenin gerçek skorunu bulalım
      const secilenSkorObj = hamleSkorlari.find(hs => hs.hamle === secilen);
      const yeniSkor = secilenSkorObj ? secilenSkorObj.puan : 0;

      // Durum analizi ve tetikleyiciler
      botunSonDurumu = 'hamleYapti';
      const skorArtisi = yeniSkor - oncekiSkor;
      const botAvantajYakaladi = bilgisayarRengi === SIYAH ? (skorArtisi >= 30) : (skorArtisi <= -30);
      const botAvantajKaybetti = bilgisayarRengi === SIYAH ? (skorArtisi <= -30) : (skorArtisi >= 30);
      const botKazaniyor = bilgisayarRengi === SIYAH ? (yeniSkor > 50) : (yeniSkor < -50);
      const botKaybediyor = bilgisayarRengi === SIYAH ? (yeniSkor < -50) : (yeniSkor > 50);

      if (botAvantajYakaladi) {
        botunSonDurumu = 'avantajYakaladi';
      } else if (botAvantajKaybetti) {
        botunSonDurumu = 'avantajKaybetti';
      } else if (botKazaniyor) {
        botunSonDurumu = 'kazaniyor';
      } else if (botKaybediyor) {
        botunSonDurumu = 'kaybediyor';
      }

      oncekiSkor = yeniSkor;

      let gecikmeSuresi = 1200;
      if (zorlukSecimi === '5') {
        gecikmeSuresi = 100;
      }

      // Bota şah çekilmişse ekstradan 1.5 saniye (1500 ms) daha beklesin
      if (sahTehditteMi(bilgisayarRengi, tahta)) {
        gecikmeSuresi += 1500;
      }

      if (kalanSure[bilgisayarRengi] < 60) {
        gecikmeSuresi = 0;
      }

      // Açılıştaki ilk hamlede default olarak 1 saniye delay olsun
      let botunIlkHamlesi = false;
      if (bilgisayarRengi === SIYAH) {
        if (hamleGecmisi.length === 0 || (hamleGecmisi.length === 1 && (!hamleGecmisi[0].siyah || hamleGecmisi[0].siyah === ''))) {
          botunIlkHamlesi = true;
        }
      } else {
        if (hamleGecmisi.length === 0) {
          botunIlkHamlesi = true;
        }
      }
      if (botunIlkHamlesi) {
        gecikmeSuresi = 1000;
      }

      // Seçim sarı ışığını hamlenin yapılmasına 300 ms kala yakalım (eğer gecikme 300 ms'den büyükse)
      const isikGecikmesi = Math.max(0, gecikmeSuresi - 300);
      setTimeout(() => {
        seciliKare = { satir: secilen.eskiS, sutun: secilen.eskiX };
        tahtayiCiz();
      }, isikGecikmesi);

      setTimeout(() => {
        aiDusununuyor = false;
        hamleYap(secilen.eskiS, secilen.eskiX, secilen.yeniS, secilen.yeniX);
      }, gecikmeSuresi);
    }

    // ===== OYUNU BAŞLAT =====
    oyunuBaslat();
  </script>
